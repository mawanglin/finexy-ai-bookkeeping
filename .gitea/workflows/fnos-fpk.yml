name: fnOS fpk

on:
  workflow_dispatch:
  push:
    tags:
      - "fnos-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://goproxy.cn,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ensure build tools
        run: |
          command -v gcc >/dev/null || { apt-get update && apt-get install -y build-essential; }
          command -v python3 >/dev/null || { apt-get update && apt-get install -y python3 python3-pip; }
      - name: Build fpk
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHS: "x86 arm"
        run: |
          deploy/fnos/build-fpk.sh
          cd deploy/fnos/out
          sha256sum *.fpk > SHA256SUMS.txt
          ls -la
      # upload-artifact@v4 is not supported by Gitea, use v3
      - uses: actions/upload-artifact@v3
        with:
          name: finexy-fnos-fpk
          path: |
            deploy/fnos/out/*.fpk
            deploy/fnos/out/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/fnos-v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          RESP=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Finexy fnOS fpk $TAG\",\"body\":\"Native (non-Docker) fnOS packages for x86_64 (-x86.fpk) and ARM64 (-arm.fpk). No OCR service included.\"}")
          ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          for f in deploy/fnos/out/*.fpk deploy/fnos/out/SHA256SUMS.txt; do
            curl -fsS -X POST "$API/releases/$ID/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f"
          done
