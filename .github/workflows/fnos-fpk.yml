name: fnOS fpk

on:
  workflow_dispatch:
  push:
    tags:
      - "fnos-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build fpk
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHS: "x86 arm"
        run: |
          deploy/fnos/build-fpk.sh
          cd deploy/fnos/out
          sha256sum *.fpk > SHA256SUMS.txt
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: finexy-fnos-fpk
          path: |
            deploy/fnos/out/*.fpk
            deploy/fnos/out/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/fnos-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" deploy/fnos/out/*.fpk deploy/fnos/out/SHA256SUMS.txt \
            --title "Finexy fnOS fpk ${{ github.ref_name }}" \
            --notes "Native (non-Docker) fnOS packages for x86_64 (-x86.fpk) and ARM64 (-arm.fpk). No OCR service included."
